name: "SAFFRONFIELD"
run-name: "Tundra"
"on":
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  Harbor:
    runs-on: ubuntu-22.04
    environment:
      name: "github-pages"
      url: ${{ steps.shoreline.outputs.page_url }}
    steps:
      - name: "MISTRAL"
        uses: actions/checkout@v6
      - name: "ARROW"
        uses: actions/configure-pages@v6
      - name: "Pandora"
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./
      - name: "BASIN"
        id: shoreline
        uses: actions/deploy-pages@v5
